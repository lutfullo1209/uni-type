<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeNexus - Easy Typing Practice</title>
    <!-- Links the external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- --- UPPER NAVIGATION BAR --- -->
    <header>
        <!-- Settings (Left Side) -->
        <div class="settings-panel">
            <select id="setting-theme" title="Theme Selector">
                <option value="default">Default Dark</option>
                <option value="dark-blue">Deep Ocean</option>
                <option value="cyberpunk">Cyberpunk</option>
            </select>
            <select id="setting-font" title="Font Family Selector">
                <option value="'Courier New', Courier, monospace">Courier New</option>
                <option value="'Segoe UI', sans-serif">Segoe UI</option>
                <option value="Georgia, serif">Georgia</option>
            </select>
            <label class="font-size-control" for="setting-size">
            Text size
                <input id="setting-size" type="range" min="16" max="48" step="1" value="24"
                aria-label="Text size" aria-valuetext="24 pixels">
                <output id="setting-size-value" for="setting-size">24px</output>
            </label>
        </div>

        <!-- Mini Games (Right Side) -->
        <div class="games-panel">
            <button onclick="openArcade('ztype')">🚀 Orbit Defense (ZType)</button>
            <button onclick="openArcade('blitz')">⚡ Letter Blitz</button>
        </div>
    </header>

    <!-- --- MAIN CORE VIEWPORT --- -->
    <main>
        <!-- Regular Typing Module -->
        <div id="typing-app">
            <div class="timer-row" id="timer-config">
                <span class="timer-option active" data-time="15">15</span>
                <span class="timer-option" data-time="30">30</span>
                <span class="timer-option" data-time="60">60</span>
                <span class="timer-option" data-time="120">120</span>
            </div>
            
            <div id="live-timer"></div>

            <div class="word-container" id="word-box" onclick="focusTyping()">
                <div id="caret"></div>
            </div>
            <input type="text" id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button id="restart-btn" style="margin: 20px auto 0 auto;" onclick="initTypingTest()">Reset Test</button>
        </div>

        <div id="results-screen">
            <h2>Test Complete!</h2>
            <p>Speed: <strong id="res-wpm" style="color:var(--main-color)">0</strong> WPM</p>
            <p>Accuracy: <strong id="res-acc">100</strong>%</p>
            <button onclick="closeResults()">Try Again</button>
        </div>
    </main>

    <!-- --- LOWER FOOTER PANEL --- -->
    <footer>
        <div class="profile-container" onclick="toggleModal(true)">
            <div class="avatar-wrapper">
                <img id="profile-avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 100 100' fill='%23646669'><circle cx='50' cy='35' r='20'/><path d='M10 85C10 65 25 55 50 55s40 10 40 30z'/></svg>" alt="Avatar">
            </div>
            <div class="profile-info">
                <span>Profile</span>
                <span id="profile-name-display">Guest Pilot</span>
            </div>
        </div>
        <div></div>
    </footer>

    <!-- Profile Management Modals -->
    <div class="modal-overlay" id="overlay" onclick="toggleModal(false)"></div>
    <div class="modal" id="profile-modal">
        <h3>Edit Your Profile</h3>
        <label for="input-profile-name">Your Name</label>
        <input type="text" id="input-profile-name" placeholder="Enter name...">
        
        <label>Profile Picture</label>
        <label class="btn-label">
            Upload Image
            <input type="file" id="input-profile-img" accept="image/*" style="display:none;">
        </label>
        
        <button style="margin-top:10px; border-color:var(--main-color);" onclick="saveProfile()">Save Profile</button>
    </div>

    <!-- Mini-Games Overlay -->
    <div class="game-overlay" id="arcade-theater">
        <div class="game-shell">
            <div class="game-header">
                <div class="game-heading">
                    <span class="game-kicker">TYPENEXUS GAME</span>
                    <h2 id="game-title">Game</h2>
                </div>
                <div class="game-controls">
                    <div id="game-score-board">Score: 0</div>
                    <button class="game-exit" onclick="closeArcade()">Exit</button>
                </div>
            </div>
            <div class="game-board">
                <canvas id="game-canvas" width="960" height="560" tabindex="-1"></canvas>
                <div class="game-board-caption">
                    <span class="live-indicator">LIVE</span>
                    <span>PROTECT YOUR SHIP</span>
                </div>
            </div>
            <div class="game-footer">
                <p id="game-instructions"></p>
                <span class="game-key-hint">TYPE TO HIT</span>
            </div>
        </div>
    </div>

    <!-- Links the external JavaScript file -->
    <script src="javascript.js"></script>
</body>
</html>
